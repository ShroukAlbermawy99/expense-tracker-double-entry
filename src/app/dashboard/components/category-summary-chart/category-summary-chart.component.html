<div>
  <highcharts-chart
    [Highcharts]="Highcharts"
    [options]="chartOptions"
    [(update)]="updateFlag"
    [oneToOne]="true"
    style="width: 100%; height: 100%; display: block">
  </highcharts-chart>
  @if (isHandset()) {
    <div class="text-center">
      <mat-icon>swipe</mat-icon>
      <span class="font-monospace fs-6">Swipe on chart to view more data</span>
    </div>
  }
</div>
<!-- [oneToOne]="true" → ensures updates replace old data instead of stacking on top. -->
<!-- class="font-monospace fs-6" is a combination of two Bootstrap CSS classes: 
     font-monospace sets the font family to a fixed-width or monospace font, 
     ideal for coding and providing a utilitarian look, while fs-6 sets the font size -->
